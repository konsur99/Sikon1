version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sikoni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sikoni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sikoni_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sikoni_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sikoni_user -d sikoni_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MinIO — Private S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: sikoni_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sikoni_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://sikoni_user:sikoni_pass@postgres:5432/sikoni_db?schema=public"
      JWT_SECRET: ${JWT_SECRET:-sikoni_super_secret_jwt_key_surakarta_2026_change_in_production}
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "4000:4000"

  # 4. Next.js Web Frontend (Public Portal & Admin)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sikoni_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:

