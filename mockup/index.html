<div id="toast" class="toast">Perubahan tersimpan</div>
<script>
const $=s=>document.querySelector(s);
let current='admin-dashboard', activeMode='admin', activeMobile='mobile-home', currentPublic='public-home';
const icon={dashboard:'▦',money:'◈',inbox:'⇩',rab:'▤',approval:'✓',lpj:'▧',cabor:'♧',docs:'▣',report:'▥',setting:'⚙',home:'⌂',bell:'♢',user:'♙',news:'▤',globe:'◎'};
const money=n=>'Rp '+Number(n).toLocaleString('id-ID');
const status=(s)=>{let c={'Disetujui':'approved','Menunggu':'pending','Ditolak':'rejected','Draft':'draft','Dibayar':'paid','Verifikasi':'review','Dalam proses':'review','Terkirim':'paid'}[s]||'draft';return `<span class="status ${c}">${s}</span>`};
const btn=(label,cls='')=>`<button class="btn ${cls}" onclick="action('${label.replace(/'/g,"\\'")}')">${label}</button>`;
const data={
 submissions:[['RAB-026/VI/26','Kejuaraan Atletik Kota','PASI','Rp 48.500.000','9 Nov 2026','Menunggu'],['RAB-025/VI/26','Pemusatan Latihan','PBSI','Rp 32.000.000','8 Nov 2026','Verifikasi'],['RAB-024/VI/26','Pengadaan Perlengkapan','PSSI','Rp 18.750.000','7 Nov 2026','Disetujui'],['RAB-023/VI/26','Kejuaraan Renang','PRSI','Rp 26.400.000','5 Nov 2026','Ditolak']],
 cabor:[['PASI','Persatuan Atletik Seluruh Indonesia','Atletik','42','Aktif'],['PBSI','Persatuan Bulutangkis Seluruh Indonesia','Bulutangkis','36','Aktif'],['PSSI','Persatuan Sepakbola Seluruh Indonesia','Sepak Bola','58','Aktif'],['PRSI','Persatuan Renang Seluruh Indonesia','Renang','24','Aktif'],['PERPANI','Persatuan Panahan Indonesia','Panahan','18','Aktif']],
 expenses:[['EXP-1126','Transportasi atlet','PASI','Rp 4.500.000','8 Nov 2026','Verifikasi'],['EXP-1125','Sewa gedung latihan','PBSI','Rp 3.000.000','8 Nov 2026','Disetujui'],['EXP-1124','Konsumsi kegiatan','PSSI','Rp 2.750.000','7 Nov 2026','Menunggu']],
};
function table(headers,rows,opts={}){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${opts.statusCol===j?status(v):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function pageHead(title,desc,actions=''){return `<div class="breadcrumbs">SIKONI <span style="color:#c1c9d1"> / </span> ${title}</div><div class="page-title-row"><div><h1 class="page-title">${title}</h1><div class="page-desc">${desc}</div></div><div class="actions">${actions}</div></div>`}
function cardHead(title,sub='',link=''){return `<div class="panel-head"><div><h3 class="card-title">${title}</h3>${sub?`<div class="card-sub">${sub}</div>`:''}</div>${link?`<button class="panel-link" onclick="nav('${link}')">Lihat semua →</button>`:''}</div>`}
function kpi(label,value,foot,ico='◈'){return `<div class="card"><div class="kpi"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div><div class="kpi-icon">${ico}</div></div></div>`}
function chart(title,sub='Tren bulanan tahun anggaran 2026'){let a=[48,61,43,71,58,83,69,76,55,88,74,91];return `<div class="card">${cardHead(title,sub)}<div class="legend"><span>Anggaran</span><span class="gold-dot">Realisasi</span></div><div class="chart-wrap">${[25,50,75,100].map((v,i)=>`<div class="chart-gridline" style="top:${100-v}%"></div><span class="chart-label" style="top:${100-v}%">${v}%</span>`).join('')}<div class="bars">${a.map((v,i)=>`<div class="bar-col"><div style="display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center"><div class="bar" style="height:${v}%"></div><div class="bar gold" style="height:${Math.max(8,v*(.48+(i%3)*.08))}%"></div></div><div class="bar-label">${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][i]}</div></div>`).join('')}</div></div></div>`}
function donut(title){return `<div class="card">${cardHead(title,'Komposisi penggunaan anggaran')}<div class="donut-row"><div class="donut"><div class="donut-center"><b>68%</b><small>Realisasi</small></div></div><div class="legend-list"><div class="legend-row"><span><i class="legend-dot" style="background:#168b8b"></i>Program olahraga</span><b>44%</b></div><div class="legend-row"><span><i class="legend-dot" style="background:#d7ac57"></i>Pembinaan atlet</span><b>25%</b></div><div class="legend-row"><span><i class="legend-dot" style="background:#9cb8ca"></i>Operasional</span><b>18%</b></div><div class="legend-row"><span><i class="legend-dot" style="background:#e9edf1"></i>Belum dialokasi</span><b>13%</b></div></div></div></div>`}
const adminNav=[['RINGKASAN',[['admin-dashboard','▦','Dashboard']]],['KEUANGAN',[['admin-finance','◈','Keuangan'],['admin-fund','＋','Dana Masuk'],['admin-budget','▤','Anggaran'],['admin-realization','⇧','Realisasi'],['admin-incentive','☆','Insentif'],['admin-tax','％','Pajak']]],['OPERASIONAL',[['admin-submissions','⇩','Pengajuan'],['admin-approvals','✓','Persetujuan'],['admin-lpj','▧','LPJ'],['admin-cabor','♧','Data Cabor']]],['DOKUMEN & LAPORAN',[['admin-documents','▣','Dokumen'],['admin-reports','▥','Laporan']]],['SISTEM',[['admin-settings','⚙','Pengaturan']]]];
const mobileNavItems=[['mobile-home','⌂','Beranda'],['mobile-finance','◈','Keuangan'],['mobile-submissions','⇩','Pengajuan'],['mobile-notifications','♢','Notifikasi'],['mobile-account','♙','Akun']];
function renderAdmin(){let nav=adminNav.map(([group,items])=>`<div class="side-caption">${group}</div>${items.map(([id,ic,label])=>`<button class="nav-item ${current===id?'active':''}" onclick="nav('${id}')"><span class="nav-icon">${ic}</span>${label}${id==='admin-approvals'?'<span class="count">6</span>':''}</button>`).join('')}`).join('');return `<div class="topbar"><div class="brand"><div class="brand-mark">SK</div><div><div class="brand-name">SIKONI</div><div class="brand-sub">SISTEM INFORMASI KONI SURAKARTA</div></div></div><div class="top-actions"><div class="searchbox">⌕ <input placeholder="Cari menu, dokumen, atau kegiatan..." oninput="globalSearch(this.value)"></div><div class="mode-switch"><button onclick="setMode('public')">Publik</button><button class="active" onclick="setMode('admin')">Admin</button><button onclick="setMode('mobile')">Android</button></div><button class="icon-btn" onclick="nav('admin-approvals')">♧<i class="dot"></i></button><div class="profile-mini"><div class="avatar">AD</div><div><b>Admin KONI</b><small>Administrator</small></div></div></div></div><div class="layout"><aside class="sidebar">${nav}<div class="side-bottom">KONI SURAKARTA<br>SIKONI v1.0 • Prototype UI<br><span style="color:#d7ac57">●</span> Data simulasi / bukan data resmi</div></aside><main class="main" id="mainContent">${adminPage()}</main></div>`}
function adminPage(){switch(current){
case'admin-dashboard':return dashboardPage();case'admin-finance':return financePage();case'admin-fund':return fundPage();case'admin-budget':return budgetPage();case'admin-realization':return realizationPage();case'admin-incentive':return incentivePage();case'admin-tax':return taxPage();case'admin-submissions':return submissionsPage();case'admin-approvals':return approvalsPage();case'admin-rab':return rabPage();case'admin-lpj':return lpjPage();case'admin-cabor':return caborPage();case'admin-documents':return documentsPage();case'admin-reports':return reportsPage();case'admin-settings':return settingsPage();default:return dashboardPage();}}
function dashboardPage(){return `${pageHead('Dashboard','Ringkasan kinerja, anggaran, dan aktivitas KONI Surakarta.','<button class="btn" onclick="action(\'Unduh ringkasan\')">⇩ Export</button><button class="btn primary" onclick="nav(\'admin-rab\')">＋ Buat RAB</button>')}<div class="grid kpi-grid">${kpi('Total pagu anggaran','Rp 2,45 M','Tahun anggaran 2026','▤')}${kpi('RAB disetujui','Rp 1,82 M','74,3% dari pagu','✓')}${kpi('Realisasi terverifikasi','Rp 1,21 M','66,5% dari RAB disetujui','⇧')}${kpi('Menunggu persetujuan','06 pengajuan','Perlu tindak lanjut','◷')}</div><div class="content-grid">${chart('Ringkasan anggaran & realisasi')}<div class="card">${cardHead('Ringkasan anggaran','Posisi berdasarkan data contoh')}<div class="metric-line"><span>Pagu tersedia</span><b>Rp 2.450.000.000</b></div><div class="metric-line"><span>RAB disetujui</span><b>Rp 1.820.000.000</b></div><div class="metric-line"><span>Realisasi terverifikasi</span><b>Rp 1.210.000.000</b></div><div class="metric-line"><span>Komitmen belum terealisasi</span><b>Rp 310.000.000</b></div><div class="metric-line"><span>Sisa pagu belum dialokasi*</span><b class="positive">Rp 630.000.000</b></div><div class="footer-note">*Angka ilustrasi. Definisi sisa pagu dan komitmen harus mengikuti kebijakan keuangan yang disahkan.</div></div></div><div class="content-grid"><div class="card">${cardHead('Pengajuan terbaru','Status pengajuan dari seluruh cabang olahraga','admin-submissions')}${table(['Nomor','Kegiatan','Cabor','Nilai','Tanggal','Status'],data.submissions.slice(0,3).map(r=>r),{statusCol:5})}</div><div class="card">${cardHead('Aktivitas terbaru','Jejak aktivitas pengguna')}<div class="notice"><div class="notice-icon">✓</div><div><b>RAB-024 disetujui</b><p>Pengadaan perlengkapan • PSSI<br>Hari ini, 10:34</p></div></div><div class="notice"><div class="notice-icon">⇩</div><div><b>Pengajuan RAB baru</b><p>Kejuaraan Atletik Kota • PASI<br>Hari ini, 09:12</p></div></div><div class="notice"><div class="notice-icon">▧</div><div><b>LPJ dikirim untuk verifikasi</b><p>Pemusatan Latihan • PBSI<br>Kemarin, 16:40</p></div></div></div></div><div class="info-strip">Mode demonstrasi: seluruh nilai dan nama kegiatan di halaman ini adalah data ilustrasi, bukan catatan keuangan resmi KONI Surakarta.</div>`}
function financePage(){return `${pageHead('Keuangan','Pemantauan dana masuk, anggaran, realisasi, insentif, dan pajak.','<button class="btn" onclick="action(\'Ekspor data keuangan\')">⇩ Export Excel</button>')}<div class="grid kpi-grid">${kpi('Dana diterima','Rp 2,45 M','Akumulasi tahun 2026','＋')}${kpi('Dialokasikan','Rp 1,82 M','74,3% dari dana diterima','▤')}${kpi('Realisasi valid','Rp 1,21 M','Sudah diverifikasi','⇧')}${kpi('Pembayaran','Rp 985 jt','Sudah dibayarkan','✓')}</div><div class="content-grid">${chart('Tren penggunaan dana')} ${donut('Distribusi anggaran')}</div><div class="card">${cardHead('Akses modul keuangan','Pilih modul untuk melihat detail pencatatan')}<div class="public-card-grid"><div class="public-card"><div class="public-card-body"><b>＋ Dana Masuk</b><p>Pencatatan penerimaan dana dan sumber pendanaan.</p><button class="btn small" onclick="nav('admin-fund')">Buka modul →</button></div></div><div class="public-card"><div class="public-card-body"><b>▤ Anggaran</b><p>Pagu, alokasi, RAB disetujui, dan sisa alokasi.</p><button class="btn small" onclick="nav('admin-budget')">Buka modul →</button></div></div><div class="public-card"><div class="public-card-body"><b>⇧ Realisasi</b><p>Pengeluaran terverifikasi dan status pembayaran.</p><button class="btn small" onclick="nav('admin-realization')">Buka modul →</button></div></div><div class="public-card"><div class="public-card-body"><b>☆ Insentif</b><p>Data penerima, periode, nilai, dan status pembayaran.</p><button class="btn small" onclick="nav('admin-incentive')">Buka modul →</button></div></div><div class="public-card"><div class="public-card-body"><b>％ Pajak</b><p>Rekap potongan dan bukti setor pajak.</p><button class="btn small" onclick="nav('admin-tax')">Buka modul →</button></div></div></div></div>`}
function fundPage(){return `${pageHead('Dana Masuk','Catat penerimaan dana berdasarkan sumber, tanggal, dan dokumen pendukung.','<button class="btn primary" onclick="modalForm(\'Tambah dana masuk\', [\'Tanggal penerimaan\',\'Sumber dana\',\'Nomor referensi\',\'Nilai penerimaan\',\'Unggah bukti penerimaan\'])">＋ Catat Dana Masuk</button>')}<div class="grid kpi-grid">${kpi('Total penerimaan','Rp 2,45 M','Tahun anggaran berjalan','＋')}${kpi('Sumber dana','04 sumber','Aktif','◈')}${kpi('Transaksi','12 transaksi','Tercatat','▤')}${kpi('Perlu verifikasi','01 transaksi','Periksa bukti','◷')}</div><div class="card">${cardHead('Riwayat dana masuk','Seluruh penerimaan yang tercatat')}${filterbar()}${table(['Tanggal','Sumber dana','Nomor referensi','Nilai','Dokumen','Status'],[['02 Jan 2026','Hibah Pemerintah Daerah','HIB/001/2026','Rp 1.500.000.000','2 lampiran', 'Disetujui'],['15 Mar 2026','Bantuan Pembinaan','BPM/015/2026','Rp 650.000.000','3 lampiran','Disetujui'],['04 Jul 2026','Sponsor Kegiatan','SPN/004/2026','Rp 250.000.000','1 lampiran','Disetujui'],['08 Nov 2026','Penerimaan lainnya','OTH/008/2026','Rp 50.000.000','1 lampiran','Menunggu']],{statusCol:5})}</div>`}
function budgetPage(){return `${pageHead('Anggaran','Kontrol pagu, alokasi per program/cabor, RAB disetujui, dan komitmen.','<button class="btn" onclick="action(\'Export anggaran\')">⇩ Export</button><button class="btn primary" onclick="modalForm(\'Tambah alokasi anggaran\',[\'Tahun anggaran\',\'Program\',\'Cabor / unit\',\'Sumber dana\',\'Nilai alokasi\'])">＋ Alokasi Anggaran</button>')}<div class="info-strip">Kontrol anggaran harus memakai nilai alokasi yang sah. RAB berstatus draft atau menunggu approval tidak dihitung sebagai realisasi.</div><div class="grid kpi-grid">${kpi('Total pagu','Rp 2,45 M','Disahkan','▤')}${kpi('Alokasi program','Rp 1,82 M','74,3%','◈')}${kpi('Komitmen aktif','Rp 310 jt','RAB disetujui, belum selesai','◷')}${kpi('Belum dialokasikan','Rp 630 jt','Bukan saldo kas','＋')}</div><div class="card">${cardHead('Alokasi per cabang olahraga','Data simulasi 2026')}${table(['Program / Cabor','Pagu','RAB disetujui','Komitmen aktif','Realisasi valid','Progress'],[['Pembinaan Atlet — PASI','Rp 320 jt','Rp 260 jt','Rp 45 jt','Rp 180 jt','<div class="progress"><span style="width:56%"></span></div>'],['Pembinaan Atlet — PBSI','Rp 280 jt','Rp 220 jt','Rp 38 jt','Rp 170 jt','<div class="progress"><span style="width:61%"></span></div>'],['Kompetisi — PSSI','Rp 450 jt','Rp 310 jt','Rp 95 jt','Rp 205 jt','<div class="progress"><span style="width:46%"></span></div>'],['Pembinaan — PRSI','Rp 190 jt','Rp 125 jt','Rp 22 jt','Rp 80 jt','<div class="progress"><span style="width:42%"></span></div>']])}</div>`}
function realizationPage(){return `${pageHead('Realisasi Pengeluaran','Pengeluaran yang telah diinput cabor, status verifikasi, dan pembayaran.','<button class="btn" onclick="action(\'Unduh rekap realisasi\')">⇩ Rekap</button>')}<div class="grid kpi-grid">${kpi('Pengeluaran diajukan','Rp 1,36 M','Termasuk menunggu verifikasi','⇧')}${kpi('Terverifikasi','Rp 1,21 M','Layak dipertanggungjawabkan','✓')}${kpi('Sudah dibayar','Rp 985 jt','Pembayaran tercatat','◈')}${kpi('Belum dibayar','Rp 225 jt','Perlu tindak lanjut kas','◷')}</div><div class="card">${cardHead('Daftar pengeluaran','Pisahkan verifikasi dokumen dari status pembayaran')}${filterbar()}${table(['ID','Uraian','Cabor','Nilai','Tanggal','Status'],data.expenses,{statusCol:5})}<div class="footer-note">Nilai belum dibayar hanya dihitung dari kewajiban yang telah diverifikasi dan disetujui untuk dibayar, bukan seluruh pengajuan.</div></div>`}
function incentivePage(){return `${pageHead('Insentif','Pengelolaan penerima insentif atlet, pelatih, dan ofisial.','<button class="btn primary" onclick="modalForm(\'Tambah data insentif\',[\'Nama penerima\',\'Cabor\',\'Kategori penerima\',\'Periode\',\'Nilai insentif\'])">＋ Tambah Insentif</button>')}<div class="grid kpi-grid">${kpi('Alokasi insentif','Rp 420 jt','Tahun 2026','☆')}${kpi('Penerima','86 orang','Atlet, pelatih, ofisial','♙')}${kpi('Sudah dibayar','Rp 305 jt','72,6%','✓')}${kpi('Menunggu proses','Rp 115 jt','Perlu verifikasi','◷')}</div><div class="card">${cardHead('Daftar insentif','Data penerima dan status pembayaran')}${table(['Nama penerima','Cabor','Kategori','Periode','Nilai','Status'],[['Andi Pratama','Atletik','Atlet','Okt 2026','Rp 5.000.000','Dibayar'],['Siti Rahma','Bulutangkis','Atlet','Okt 2026','Rp 5.000.000','Menunggu'],['Budi Santoso','Renang','Pelatih','Okt 2026','Rp 7.500.000','Verifikasi'] ],{statusCol:5})}</div>`}
function taxPage(){return `${pageHead('Pajak','Rekap kewajiban, pemotongan, dan bukti penyetoran pajak transaksi.','<button class="btn primary" onclick="modalForm(\'Catat transaksi pajak\',[\'Nomor transaksi\',\'Jenis pajak\',\'Dasar pengenaan\',\'Tarif sesuai ketentuan\',\'Nilai pajak\',\'Tanggal setor\'])">＋ Catat Pajak</button>')}<div class="warning-strip">Tarif pajak tidak ditetapkan permanen di tampilan ini. Aturan harus mengikuti jenis transaksi, status penerima, ketentuan perpajakan yang berlaku, dan konfigurasi resmi.</div><div class="grid kpi-grid">${kpi('Pajak terhitung','Rp 48,5 jt','Data simulasi','％')}${kpi('Sudah disetor','Rp 42,1 jt','86,8%','✓')}${kpi('Belum disetor','Rp 6,4 jt','Perlu tindak lanjut','◷')}${kpi('Bukti setor','18 dokumen','Tercatat','▣')}</div><div class="card">${cardHead('Daftar transaksi pajak','Hubungkan pajak dengan transaksi sumber')}${table(['Referensi','Jenis','Dasar pengenaan','Pajak','Tanggal','Status'],[['EXP-1108','PPh sesuai klasifikasi','Rp 12.000.000','Rp 600.000','06 Nov 2026','Dibayar'],['EXP-1097','PPN sesuai klasifikasi','Rp 25.000.000','Rp 2.750.000','03 Nov 2026','Menunggu']],{statusCol:5})}</div>`}
function filterbar(){return `<div class="filterbar"><input class="field search" placeholder="⌕ Cari nomor / kegiatan..." oninput="filterTable(this)"><select class="field"><option>Semua status</option><option>Menunggu</option><option>Disetujui</option><option>Ditolak</option></select><select class="field"><option>Tahun 2026</option><option>2025</option></select><button class="btn small" onclick="toast('Filter diterapkan pada data demo')">Terapkan</button></div>`}

else if(activeMobile==='mobile-notifications'){content=`<div class="mobile-greeting">Pembaruan sistem</div><h1 class="mobile-heading">Notifikasi</h1><div class="mobile-card"><div class="mobile-card-head"><b>Hari ini</b><span class="tag">3 baru</span></div>${mobileItem('✓','RAB memerlukan verifikasi','RAB-026 • 09:12','','Menunggu')}${mobileItem('▣','Dokumen berhasil diunggah','EXP-1126 • 08:45','','Terkirim')}${mobileItem('↶','LPJ dikembalikan untuk revisi','LPJ-011 • 08:10','','Ditolak')}</div><div class="mobile-card"><div class="mobile-card-head"><b>Kemarin</b></div>${mobileItem('✓','RAB telah disetujui','RAB-021 • 16:30','','Disetujui')}${mobileItem('♢','Pengingat kelengkapan dokumen','LPJ-013 • 10:05','','')}</div>`}
else if(activeMobile==='mobile-account'){content=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><div class="avatar" style="width:52px;height:52px;font-size:15px">PS</div><div><b style="font-size:14px;color:var(--navy)">Operator PASI</b><div style="font-size:10px;color:#8d99a6;margin-top:4px">PASI — Cabang Olahraga Atletik</div></div></div><div class="mobile-card"><div class="mobile-card-head"><b>Profil akun</b><button onclick="action('Edit profil')">Ubah</button></div><div class="metric-line"><span>Nama pengguna</span><b>Operator PASI</b></div><div class="metric-line"><span>Email</span><b>operator@pasi.demo</b></div><div class="metric-line"><span>Hak akses</span><b>Operator Cabor</b></div><div class="metric-line"><span>Cabang olahraga</span><b>PASI</b></div></div><div class="mobile-card">${mobileItem('♙','Data profil','Informasi akun','','')}${mobileItem('♢','Preferensi notifikasi','Pengaturan pemberitahuan','','')}${mobileItem('▣','Bantuan & panduan','Panduan penggunaan SIKONI','','')}${mobileItem('⚙','Keamanan akun','Kata sandi dan perangkat','','')}</div><button class="btn danger" style="width:100%;justify-content:center" onclick="toast('Demo: sesi belum terhubung')">Keluar</button>`}
else if(activeMobile==='mobile-rab-form'){content=`<div class="mobile-greeting">Pengajuan anggaran kegiatan</div><h1 class="mobile-heading">Buat RAB</h1><div class="stepper"><div class="step active"><span class="step-num">1</span>Info</div><div class="step"><span class="step-num">2</span>Biaya</div><div class="step"><span class="step-num">3</span>Kirim</div></div><div class="mobile-form-card"><div class="form-group"><label>Nama kegiatan *</label><input placeholder="Contoh: Kejuaraan Atletik Kota"></div><div class="form-group"><label>Program</label><select><option>Pembinaan dan kompetisi</option></select></div><div class="form-group"><label>Periode kegiatan</label><input placeholder="Tanggal mulai - selesai"></div><div class="form-group"><label>Lokasi</label><input placeholder="Lokasi pelaksanaan"></div><div class="form-group"><label>Uraian kegiatan</label><textarea placeholder="Jelaskan tujuan dan sasaran kegiatan"></textarea></div></div><div class="mobile-form-card"><b style="font-size:11px;color:var(--navy)">Ringkasan pengajuan</b><p class="card-sub">Item biaya ditambahkan pada langkah berikutnya. Draft dapat disimpan sebelum diajukan.</p></div><div class="mobile-bottom-action"><button class="btn" onclick="action('Simpan draft RAB')">Simpan draft</button><button class="btn primary" onclick="toast('Demo: lanjut ke rincian biaya')">Lanjut →</button></div>`}
else if(activeMobile==='mobile-expense-form'){content=`<div class="mobile-greeting">Pencatatan realisasi kegiatan</div><h1 class="mobile-heading">Input Pengeluaran</h1><div class="mobile-form-card"><div class="form-group"><label>Kegiatan / RAB terkait *</label><select><option>Kejuaraan Atletik Kota — RAB-026</option></select></div><div class="form-group"><label>Tanggal pengeluaran *</label><input type="date" value="2026-11-09"></div><div class="form-group"><label>Uraian pengeluaran *</label><input placeholder="Contoh: Konsumsi atlet"></div><div class="form-group"><label>Nilai pengeluaran *</label><input placeholder="Rp 0" inputmode="numeric"></div><div class="form-group"><label>Metode pembayaran</label><select><option>Uang muka / panjar</option><option>Reimbursement</option><option>Pembayaran langsung</option></select></div><div class="form-group"><label>Bukti transaksi *</label><div style="border:1px dashed #b8c7d1;border-radius:9px;padding:17px;text-align:center;color:#8293a2;font-size:10px">＋ Unggah foto / PDF bukti transaksi</div></div><div class="form-group"><label>Catatan</label><textarea placeholder="Catatan tambahan"></textarea></div></div><div class="mobile-bottom-action"><button class="btn" onclick="action('Simpan draft pengeluaran')">Simpan draft</button><button class="btn primary" onclick="modalConfirm('Kirim pengeluaran?','Pengeluaran akan masuk ke proses verifikasi sesuai aturan yang berlaku.')">Kirim</button></div>`}
else {content=`<div class="mobile-greeting">Pertanggungjawaban kegiatan</div><h1 class="mobile-heading">LPJ</h1><div class="mobile-card"><div class="mobile-card-head"><b>LPJ kegiatan</b><button onclick="action('Buat LPJ baru')">＋ Baru</button></div>${mobileItem('▧','Pemusatan Latihan','LPJ-014 • 08 Nov 2026','Rp 31,8 jt','Verifikasi')}${mobileItem('▧','Kejuaraan Daerah','LPJ-013 • 04 Nov 2026','Rp 42,1 jt','Disetujui')}</div><div class="mobile-card"><div class="mobile-card-head"><b>Checklist LPJ</b></div>${['Identitas dan ringkasan kegiatan','Realisasi terhadap RAB','Bukti pengeluaran','Bukti pembayaran','Dokumentasi kegiatan'].map((t,i)=>`<div class="metric-line"><span>${t}</span><b class="${i<2?'positive':'warning'}">${i<2?'✓ Lengkap':'◷ Periksa'}</b></div>`).join('')}</div>`}
return `<div class="mobile-frame"><div class="mobile-top"><div class="mobile-brand"><div class="brand-mark">SK</div><span>SIKONI</span></div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:10px;color:#8794a1">PASI</span><button class="icon-btn" style="height:32px;width:32px" onclick="mobileNav('mobile-notifications')">♢<i class="dot"></i></button></div></div><div class="mobile-content">${content}</div><nav class="mobile-nav">${mobileNavItems.map(([id,ic,label])=>`<button class="${activeMobile===id?'active':''}" onclick="mobileNav('${id}')"><span>${ic}</span>${label}</button>`).join('')}</nav></div>`}
function mobileItem(ic,title,sub,value,st){return `<div class="mobile-list-item"><div class="mobile-list-icon">${ic}</div><div class="mobile-list-text"><b>${title}</b><small>${sub}</small></div><div style="text-align:right">${value?`<strong>${value}</strong><br>`:''}${st?status(st):''}</div></div>`}
function renderMobile(){return `<div style="min-height:100vh;background:#e9edf1;padding:12px 0 0"><div style="display:flex;justify-content:center;align-items:center;gap:10px;padding:0 14px 11px"><span style="font-size:10px;color:#607184">PRATINJAU APLIKASI ANDROID</span><div class="mode-switch"><button onclick="setMode('public')">Publik</button><button onclick="setMode('admin')">Admin</button><button class="active" onclick="setMode('mobile')">Android</button></div></div>${mobilePage()}</div>`}
function render(){let app=$('#app');app.innerHTML=activeMode==='admin'?renderAdmin():activeMode==='public'?renderPublic():renderMobile();}
function nav(id){current=id;activeMode='admin';render();window.scrollTo(0,0)}
function publicNav(id){currentPublic=id;activeMode='public';render();window.scrollTo(0,0)}
function mobileNav(id){activeMobile=id;activeMode='mobile';render();window.scrollTo(0,0)}
function setMode(m){activeMode=m;render();window.scrollTo(0,0)}
function action(s){toast(s+' — aksi simulasi prototipe')}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function modalConfirm(title,desc){openModal(title,`<p style="font-size:11px;color:#758392;line-height:1.7">${desc}</p><div class="form-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="closeModal();toast('Tindakan simulasi berhasil')">Konfirmasi</button></div>`)}
function modalForm(title,fields){openModal(title,`<div class="two-col-form">${fields.map((f,i)=>`<div class="form-group ${i===fields.length-1?'full':''}"><label>${f}</label><input placeholder="Masukkan ${f.toLowerCase()}"></div>`).join('')}</div><div class="form-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="closeModal();toast('Data demo tersimpan sementara')">Simpan</button></div>`)}
function filterTable(input){let q=input.value.toLowerCase(), table=input.closest('.card').querySelector('tbody');if(!table)return;[...table.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function filterCards(input){let q=input.value.toLowerCase();document.querySelectorAll('#publicCaborGrid .public-card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none')}
function globalSearch(q){if(q.length>2)toast('Pencarian demo: '+q)}
render();
</script>
</body></html>
